name: "Tapp Release Gate"
description: "PR-aware app exploration and deterministic release-contract gates for iOS, Android, and web, with inspectable evidence."
author: Tapp
branding:
  icon: check-circle
  color: blue

inputs:
  platform:
    description: "Target platform: ios, android, or web"
    required: false
    default: "ios"
  url:
    description: "Web: URL of an already-running owned app. Omit to detect/build/start/stop one target from the repository."
    required: false
    default: ""
  web-target:
    description: "Web: target name, id, or repository-relative path when more than one browser target is detected."
    required: false
    default: ""
  target-key:
    description: "Stable application-model target id used to isolate baselines for multiple targets on the same platform."
    required: false
    default: "default"
  android-app-id:
    description: "Android: application id, e.g. com.example.app"
    required: false
    default: ""
  android-serial:
    description: "Android: optional adb device serial (the caller must start/connect the emulator)"
    required: false
    default: ""
  bundle-id:
    description: "Bundle identifier of the app under test. Auto-detected from the built .app when omitted."
    required: false
    default: ""
  app-path:
    description: "iOS simulator .app or Android .apk. If omitted, the action builds from the platform project inputs."
    required: false
    default: ""
  project:
    description: "Path to the .xcodeproj or .xcworkspace to build (used when app-path is not given)"
    required: false
    default: ""
  scheme:
    description: "Scheme to build (used when app-path is not given)"
    required: false
    default: ""
  configuration:
    description: "Build configuration"
    required: false
    default: "Debug"
  android-project:
    description: "Android: Gradle project directory (defaults to the workspace)"
    required: false
    default: ""
  android-task:
    description: "Android: Gradle APK build task"
    required: false
    default: "assembleDebug"
  max-actions:
    description: "Exploration budget (number of autonomous actions)"
    required: false
    default: "40"
  timeout:
    description: "Exploration watchdog in seconds"
    required: false
    default: "600"
  flows:
    description: "Glob of Flow YAMLs to replay (default: .tapp/flows/*.yml in the workspace, if present)"
    required: false
    default: ""
  scenarios:
    description: "Web: glob of multi-actor Scenario YAMLs (default: .tapp/scenarios/*.yml when present)"
    required: false
    default: ""
  contracts:
    description: "Glob of TypeScript release contracts (default: .tapp/contracts/*.contract.ts when present)"
    required: false
    default: ""
  pr-selection:
    description: "On pull requests, run critical/always contracts plus contracts selected from the real changed-file set and reviewed UI Map/Task ownership."
    required: false
    default: "true"
  baseline:
    description: "Path to a baseline report JSON. If omitted, .tapp/baseline.json wins; otherwise the latest successful, conclusive default-branch report is restored automatically."
    required: false
    default: ""
  fail-on:
    description: "Gate policy: gate (regressions + failed release contracts/flows; default), absolute (any current-run deterministic findings-block or inconclusive run — no baseline needed), any (any finding)"
    required: false
    default: "gate"
  simulator-device:
    description: "Simulator device to boot when none is booted"
    required: false
    default: "iPhone 16 Pro"
  test-email:
    description: "Login email for apps behind an auth wall (pass via a secret). Used by the exploration login preamble."
    required: false
    default: ""
  test-password:
    description: "Login password for apps behind an auth wall (pass via a secret)."
    required: false
    default: ""
  launch-args:
    description: 'JSON array of app launch arguments, e.g. ["--uitesting"] to bypass login on a supporting build.'
    required: false
    default: ""
  launch-env:
    description: 'JSON object of app launch environment, e.g. {"UI_TEST_BACKEND":"staging"}.'
    required: false
    default: ""
  login-steps:
    description: 'JSON array of explicit login steps for a custom login UI (see .tapp.yml app.login.steps). $TEST_EMAIL/$TEST_PASSWORD are substituted.'
    required: false
    default: ""
  comment-on-pr:
    description: "Post the report as a sticky comment on the PR (only on pull_request events)."
    required: false
    default: "true"
  github-token:
    description: "Token used to post the PR comment. Defaults to the workflow token."
    required: false
    default: ${{ github.token }}

outputs:
  report:
    description: "Path to the full JSON report (usable as the next baseline)"
    value: ${{ steps.gate.outputs.report }}
  outcome:
    description: "The gate outcome: pass | fail | inconclusive (fail and inconclusive both block a merge)"
    value: ${{ steps.gate.outputs.outcome }}
  gate-failed:
    description: "true when the gate failed (merge should be blocked)"
    value: ${{ steps.gate.outputs.gate_failed }}
  baseline-source:
    description: "Baseline source: explicit | committed | automatic | none"
    value: ${{ steps.baseline.outputs.source }}
  pr-plan:
    description: "Path to the PR selection, coverage-gap, replay, and maintenance-candidate plan when PR selection ran"
    value: ${{ steps.gate.outputs.pr_plan }}

runs:
  using: composite
  steps:
    - name: Prepare Tapp runtime
      shell: bash
      run: |
        set -euo pipefail
        echo "TAPP_HOME=$RUNNER_TEMP/tapp-home" >> "$GITHUB_ENV"

    - name: Validate target baseline key
      id: target
      shell: bash
      env:
        TAPP_INPUT_TARGET_KEY: ${{ inputs.target-key }}
      run: |
        set -euo pipefail
        python3 -c 'import os,re,sys; value=os.environ["TAPP_INPUT_TARGET_KEY"]; sys.exit(0 if re.fullmatch(r"[A-Za-z0-9._-]{1,100}", value) else 2)' \
          || { echo "::error::target-key must contain only letters, numbers, dot, underscore, or hyphen (max 100)"; exit 2; }
        echo "key=$TAPP_INPUT_TARGET_KEY" >> "$GITHUB_OUTPUT"

    - name: Install Tapp runtime dependencies
      shell: bash
      env:
        TAPP_ACTION_PATH: ${{ github.action_path }}
        TAPP_INPUT_PLATFORM: ${{ inputs.platform }}
      run: |
        set -euo pipefail
        npm ci --prefix "$TAPP_ACTION_PATH" --omit=dev --ignore-scripts --no-audit --no-fund
        if [[ "$TAPP_INPUT_PLATFORM" == "web" ]]; then
          node "$TAPP_ACTION_PATH/node_modules/playwright/cli.js" install chromium
        fi

    - name: Read pull request changed files
      if: github.event_name == 'pull_request' && inputs.pr-selection == 'true'
      id: pr-changes
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
      env:
        TAPP_PR_CHANGED_FILES_PATH: ${{ runner.temp }}/tapp-pr-changed-files.json
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const { owner, repo } = context.repo;
          const pull_number = context.payload.pull_request?.number;
          if (!pull_number) throw new Error('pull_request payload is missing its number');
          const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number, per_page: 100 });
          const changed = files.map(file => ({
            filename: file.filename,
            ...(file.previous_filename ? { previous_filename: file.previous_filename } : {}),
            ...(typeof file.patch === 'string' ? { patch: file.patch } : {}),
          })).sort((a, b) => a.filename.localeCompare(b.filename));
          if (!changed.length) throw new Error('GitHub returned no changed files for this pull request');
          fs.writeFileSync(process.env.TAPP_PR_CHANGED_FILES_PATH, JSON.stringify(changed, null, 2) + '\n');
          core.setOutput('path', process.env.TAPP_PR_CHANGED_FILES_PATH);
          core.setOutput('count', String(changed.length));

    - name: Restore automatic baseline
      if: inputs.baseline == '' && hashFiles('.tapp/baseline.json') == ''
      id: baseline-cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ runner.temp }}/tapp-baseline
        key: tapp-baseline-v3-${{ inputs.platform }}-${{ steps.target.outputs.key }}-${{ runner.os }}-${{ github.repository }}-${{ github.sha }}
        restore-keys: |
          tapp-baseline-v3-${{ inputs.platform }}-${{ steps.target.outputs.key }}-${{ runner.os }}-${{ github.repository }}-

    - name: Find durable automatic baseline
      if: inputs.baseline == '' && hashFiles('.tapp/baseline.json') == '' && steps.baseline-cache.outputs.cache-matched-key == ''
      id: baseline-artifact
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
      env:
        TAPP_INPUT_PLATFORM: ${{ inputs.platform }}
        TAPP_INPUT_TARGET_KEY: ${{ steps.target.outputs.key }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const { owner, repo } = context.repo;
          const defaultBranch = context.payload.repository?.default_branch;
          const { data } = await github.rest.actions.listArtifactsForRepo({
            owner, repo, name: `tapp-baseline-${process.env.TAPP_INPUT_PLATFORM}-${process.env.TAPP_INPUT_TARGET_KEY}`, per_page: 100,
          });
          const artifact = data.artifacts
            .filter(a => !a.expired && a.workflow_run?.head_branch === defaultBranch)
            .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];
          core.setOutput('artifact-id', artifact ? String(artifact.id) : '');
          core.setOutput('run-id', artifact ? String(artifact.workflow_run.id) : '');

    - name: Restore durable automatic baseline
      if: inputs.baseline == '' && hashFiles('.tapp/baseline.json') == '' && steps.baseline-cache.outputs.cache-matched-key == '' && steps.baseline-artifact.outputs.artifact-id != ''
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        artifact-ids: ${{ steps.baseline-artifact.outputs.artifact-id }}
        github-token: ${{ inputs.github-token }}
        repository: ${{ github.repository }}
        run-id: ${{ steps.baseline-artifact.outputs.run-id }}
        path: ${{ runner.temp }}/tapp-baseline
        merge-multiple: true

    - name: Resolve baseline
      id: baseline
      shell: bash
      env:
        TAPP_INPUT_BASELINE: ${{ inputs.baseline }}
      run: |
        set -euo pipefail
        SOURCE="none"
        PATH_TO_USE=""
        if [[ -n "$TAPP_INPUT_BASELINE" ]]; then
          [[ -f "$TAPP_INPUT_BASELINE" ]] || { echo "::error::Baseline not found: $TAPP_INPUT_BASELINE"; exit 2; }
          SOURCE="explicit"
          PATH_TO_USE="$TAPP_INPUT_BASELINE"
        elif [[ -f "$GITHUB_WORKSPACE/.tapp/baseline.json" ]]; then
          SOURCE="committed"
          PATH_TO_USE="$GITHUB_WORKSPACE/.tapp/baseline.json"
        elif [[ -f "$RUNNER_TEMP/tapp-baseline/baseline.json" ]]; then
          SOURCE="automatic"
          PATH_TO_USE="$RUNNER_TEMP/tapp-baseline/baseline.json"
        fi
        echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
        echo "path=$PATH_TO_USE" >> "$GITHUB_OUTPUT"
        echo "TAPP_BASELINE_PATH=$PATH_TO_USE" >> "$GITHUB_ENV"
        echo "Baseline: $SOURCE${PATH_TO_USE:+ ($PATH_TO_USE)}"

    - name: Build app for simulator
      if: inputs.platform == 'ios' && inputs.app-path == ''
      shell: bash
      env:
        TAPP_INPUT_SCHEME: ${{ inputs.scheme }}
        TAPP_INPUT_PROJECT: ${{ inputs.project }}
        TAPP_INPUT_CONFIGURATION: ${{ inputs.configuration }}
      run: |
        set -euo pipefail
        [[ -n "$TAPP_INPUT_SCHEME" ]] || { echo "::error::Provide either app-path or project+scheme"; exit 2; }
        FLAG="-project"; [[ "$TAPP_INPUT_PROJECT" == *.xcworkspace ]] && FLAG="-workspace"
        xcodebuild "$FLAG" "$TAPP_INPUT_PROJECT" -scheme "$TAPP_INPUT_SCHEME" \
          -configuration "$TAPP_INPUT_CONFIGURATION" \
          -destination 'generic/platform=iOS Simulator' \
          -derivedDataPath "$RUNNER_TEMP/tapp-app-build" \
          CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO build | tail -5
        APP="$(find "$RUNNER_TEMP/tapp-app-build/Build/Products" -maxdepth 2 -name '*.app' -path '*iphonesimulator*' | head -1)"
        [[ -n "$APP" ]] || { echo "::error::Build produced no simulator .app"; exit 1; }
        echo "TAPP_APP_PATH=$APP" >> "$GITHUB_ENV"

    - name: Build Android APK
      if: inputs.platform == 'android' && inputs.app-path == ''
      shell: bash
      env:
        TAPP_INPUT_ANDROID_PROJECT: ${{ inputs.android-project }}
        TAPP_INPUT_ANDROID_TASK: ${{ inputs.android-task }}
      run: |
        set -euo pipefail
        PROJECT_INPUT="${TAPP_INPUT_ANDROID_PROJECT:-$GITHUB_WORKSPACE}"
        [[ -d "$PROJECT_INPUT" ]] || { echo "::error::Android project not found: $PROJECT_INPUT"; exit 2; }
        PROJECT_DIR="$(cd "$PROJECT_INPUT" && pwd -P)"
        case "$PROJECT_DIR/" in "$GITHUB_WORKSPACE/"*) ;; *) echo "::error::Android project must remain inside the checked-out repository"; exit 2;; esac
        TASK_PATH="${TAPP_INPUT_ANDROID_TASK#:}"
        IFS=':' read -r -a TASK_PARTS <<< "$TASK_PATH"
        [[ "${#TASK_PARTS[@]}" -gt 0 ]] || { echo "::error::Android Gradle task is empty"; exit 2; }
        for PART in "${TASK_PARTS[@]}"; do
          [[ "$PART" =~ ^[A-Za-z0-9_.-]+$ && "$PART" != "." && "$PART" != ".." ]] || { echo "::error::Android Gradle task contains an unsafe path segment"; exit 2; }
        done
        pushd "$PROJECT_DIR" >/dev/null
        if [[ -x ./gradlew ]]; then ./gradlew "$TAPP_INPUT_ANDROID_TASK" --no-daemon
        elif [[ -f ./gradlew ]]; then bash ./gradlew "$TAPP_INPUT_ANDROID_TASK" --no-daemon
        else echo "::error::No Gradle wrapper found; commit gradlew or pass a prebuilt app-path"; exit 2
        fi
        popd >/dev/null
        MODULE_COUNT=$((${#TASK_PARTS[@]} - 1))
        APK_ROOT="$PROJECT_DIR/build/outputs/apk"
        if [[ "$MODULE_COUNT" -gt 0 ]]; then
          MODULE_REL="$(IFS=/; echo "${TASK_PARTS[*]:0:$MODULE_COUNT}")"
          APK_ROOT="$PROJECT_DIR/$MODULE_REL/build/outputs/apk"
        fi
        APKS=()
        while IFS= read -r -d '' APK_CANDIDATE; do APKS+=("$APK_CANDIDATE"); done < <(find "$APK_ROOT" -type f -name '*.apk' ! -name '*-androidTest.apk' -print0 2>/dev/null)
        [[ "${#APKS[@]}" -gt 0 ]] || { echo "::error::Android task produced no application APK under $APK_ROOT"; exit 1; }
        [[ "${#APKS[@]}" -eq 1 ]] || { printf '::error::Android task produced multiple APKs; pass the intended artifact with app-path\n%s\n' "${APKS[@]}"; exit 2; }
        APK="${APKS[0]}"
        echo "TAPP_APP_PATH=$APK" >> "$GITHUB_ENV"

    - name: Use prebuilt app
      if: inputs.platform != 'web' && inputs.app-path != ''
      shell: bash
      env:
        TAPP_INPUT_APP_PATH: ${{ inputs.app-path }}
      run: echo "TAPP_APP_PATH=$TAPP_INPUT_APP_PATH" >> "$GITHUB_ENV"

    - name: Run Tapp gate
      id: gate
      shell: bash
      # Credentials / launch config for apps behind an auth wall — read by quick-capture.sh's
      # explore config builder (inherited through ci-gate.sh). Empty inputs are skipped there.
      env:
        OCQA_TEST_EMAIL: ${{ inputs.test-email }}
        OCQA_TEST_PASSWORD: ${{ inputs.test-password }}
        OCQA_APP_LAUNCH_ARGS_JSON: ${{ inputs.launch-args }}
        OCQA_APP_LAUNCH_ENV_JSON: ${{ inputs.launch-env }}
        OCQA_LOGIN_STEPS_JSON: ${{ inputs.login-steps }}
        TAPP_INPUT_BUNDLE_ID: ${{ inputs.bundle-id }}
        TAPP_INPUT_PLATFORM: ${{ inputs.platform }}
        TAPP_INPUT_URL: ${{ inputs.url }}
        TAPP_INPUT_WEB_TARGET: ${{ inputs.web-target }}
        TAPP_INPUT_TARGET_KEY: ${{ steps.target.outputs.key }}
        TAPP_INPUT_ANDROID_APP_ID: ${{ inputs.android-app-id }}
        TAPP_INPUT_ANDROID_SERIAL: ${{ inputs.android-serial }}
        TAPP_INPUT_MAX_ACTIONS: ${{ inputs.max-actions }}
        TAPP_INPUT_TIMEOUT: ${{ inputs.timeout }}
        TAPP_INPUT_FAIL_ON: ${{ inputs.fail-on }}
        TAPP_INPUT_DEVICE: ${{ inputs.simulator-device }}
        TAPP_INPUT_FLOWS: ${{ inputs.flows }}
        TAPP_INPUT_SCENARIOS: ${{ inputs.scenarios }}
        TAPP_INPUT_CONTRACTS: ${{ inputs.contracts }}
        TAPP_INPUT_PR_SELECTION: ${{ inputs.pr-selection }}
        TAPP_PR_CHANGED_FILES_PATH: ${{ steps.pr-changes.outputs.path }}
      run: |
        set -uo pipefail
        # PyYAML for flow_lib.py; some runner pythons are PEP-668 externally-managed.
        python3 -c "import yaml" 2>/dev/null || pip3 install --quiet pyyaml 2>/dev/null \
          || pip3 install --quiet --break-system-packages pyyaml || true
        REPORT="$RUNNER_TEMP/tapp-report.json"
        MD="$RUNNER_TEMP/tapp-report.md"
        [[ "$TAPP_INPUT_PLATFORM" == "ios" || "$TAPP_INPUT_PLATFORM" == "android" || "$TAPP_INPUT_PLATFORM" == "web" ]] \
          || { echo "::error::platform must be ios, android, or web"; exit 2; }
        ARGS=(--platform "$TAPP_INPUT_PLATFORM"
              --target-key "$TAPP_INPUT_TARGET_KEY"
              --actions "$TAPP_INPUT_MAX_ACTIONS" --timeout "$TAPP_INPUT_TIMEOUT"
              --fail-on "$TAPP_INPUT_FAIL_ON"
              --project-dir "$GITHUB_WORKSPACE"
              --json-out "$REPORT" --md-out "$MD")
        if [[ "$TAPP_INPUT_PLATFORM" == "ios" ]]; then
          ARGS+=(--app "$TAPP_APP_PATH" --bundle-id "$TAPP_INPUT_BUNDLE_ID" --device "$TAPP_INPUT_DEVICE")
        elif [[ "$TAPP_INPUT_PLATFORM" == "android" ]]; then
          [[ -n "$TAPP_INPUT_ANDROID_APP_ID" ]] || { echo "::error::android-app-id is required"; exit 2; }
          ARGS+=(--apk "$TAPP_APP_PATH" --app-id "$TAPP_INPUT_ANDROID_APP_ID")
          [[ -n "$TAPP_INPUT_ANDROID_SERIAL" ]] && ARGS+=(--serial "$TAPP_INPUT_ANDROID_SERIAL")
        else
          [[ -n "$TAPP_INPUT_URL" ]] && ARGS+=(--url "$TAPP_INPUT_URL")
          [[ -n "$TAPP_INPUT_WEB_TARGET" ]] && ARGS+=(--web-target "$TAPP_INPUT_WEB_TARGET")
        fi
        [[ -n "$TAPP_INPUT_FLOWS" ]] && ARGS+=(--flows "$TAPP_INPUT_FLOWS")
        [[ -n "$TAPP_INPUT_SCENARIOS" ]] && ARGS+=(--scenarios "$TAPP_INPUT_SCENARIOS")
        [[ -n "$TAPP_INPUT_CONTRACTS" ]] && ARGS+=(--contracts "$TAPP_INPUT_CONTRACTS")
        [[ -n "$TAPP_BASELINE_PATH" ]] && ARGS+=(--baseline "$TAPP_BASELINE_PATH")
        echo "report=$REPORT" >> "$GITHUB_OUTPUT"
        echo "md=$MD" >> "$GITHUB_OUTPUT"
        PR_PLAN=""
        if [[ "$TAPP_INPUT_PR_SELECTION" == "true" && -n "$TAPP_PR_CHANGED_FILES_PATH" ]]; then
          PR_PLAN="$RUNNER_TEMP/tapp-pr-plan.json"
          ARGS+=(--changed-files-file "$TAPP_PR_CHANGED_FILES_PATH" --pr-plan-out "$PR_PLAN")
        fi
        echo "pr_plan=$PR_PLAN" >> "$GITHUB_OUTPUT"
        # Capture the gate's exit code without failing the step, so the PR comment + evidence
        # upload still run. The job is failed at the end by "Enforce gate".
        set +e
        "${{ github.action_path }}/scripts/ci-gate.sh" "${ARGS[@]}"
        RC=$?
        set -e
        echo "gate_failed=$([[ $RC -ne 0 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        # Outcome is derived from the gate's EXACT exit code (the authoritative contract, equal to
        # GATE_EXIT[outcome]), so it is correct even when the run crashed before writing a report:
        # 0 pass · 1 fail · 2 error · 3 inconclusive. fail and inconclusive both block the merge but
        # stay distinct — no nonzero-collapse.
        case "$RC" in
          0) OUTCOME=pass ;;
          1) OUTCOME=fail ;;
          2) OUTCOME=error ;;
          3) OUTCOME=inconclusive ;;
          *) OUTCOME=fail ;;
        esac
        echo "outcome=$OUTCOME" >> "$GITHUB_OUTPUT"

    - name: Stage automatic default-branch baseline
      id: baseline-stage
      if: always() && inputs.baseline == '' && steps.baseline.outputs.source != 'committed' && steps.gate.outputs.gate_failed == 'false' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      shell: bash
      env:
        TAPP_REPORT_PATH: ${{ steps.gate.outputs.report }}
      run: |
        set -euo pipefail
        echo "save=false" >> "$GITHUB_OUTPUT"
        [[ -f "$TAPP_REPORT_PATH" ]] || { echo "No report produced; automatic baseline not updated."; exit 0; }
        # Only a clean PASS is allowed to become the new baseline. Reading the structured gate
        # outcome (not the retired `verdict`) prevents a fail/inconclusive run from poisoning it.
        python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); sys.exit(0 if r.get("gate",{}).get("outcome") == "pass" else 1)' "$TAPP_REPORT_PATH" \
          || { echo "Non-passing run (fail/inconclusive); automatic baseline not updated."; exit 0; }
        mkdir -p "$RUNNER_TEMP/tapp-baseline"
        cp "$TAPP_REPORT_PATH" "$RUNNER_TEMP/tapp-baseline/baseline.json"
        echo "save=true" >> "$GITHUB_OUTPUT"
        echo "Staged this default-branch report as the baseline for future pull requests."

    - name: Upload durable default-branch baseline
      if: always() && steps.baseline-stage.outputs.save == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: tapp-baseline-${{ inputs.platform }}-${{ steps.target.outputs.key }}
        path: ${{ runner.temp }}/tapp-baseline/baseline.json
        if-no-files-found: error
        retention-days: 90

    - name: Cache default-branch baseline
      if: always() && steps.baseline-stage.outputs.save == 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ runner.temp }}/tapp-baseline
        key: tapp-baseline-v3-${{ inputs.platform }}-${{ steps.target.outputs.key }}-${{ runner.os }}-${{ github.repository }}-${{ github.sha }}

    - name: Comment on PR
      if: always() && github.event_name == 'pull_request' && inputs.comment-on-pr == 'true'
      continue-on-error: true # fork PR tokens are read-only; the gate + evidence must still complete
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
      env:
        TAPP_TARGET_KEY: ${{ steps.target.outputs.key }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const mdPath = ${{ toJSON(steps.gate.outputs.md) }};
          let body = '## Tapp release check\n_No report was produced — the exploration did not run._';
          try { if (mdPath && fs.existsSync(mdPath)) body = fs.readFileSync(mdPath, 'utf8'); } catch (e) {}
          const marker = `<!-- tapp-release-check:${process.env.TAPP_TARGET_KEY} -->`;
          body = `${marker}\n${body}`;
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
          const existing = comments.find(c => c.body && c.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }

    - name: Resolve evidence path
      if: always()
      shell: bash
      run: echo "TAPP_CAPTURES_DIR=$RUNNER_TEMP/tapp-home/captures" >> "$GITHUB_ENV"

    - name: Upload evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: tapp-evidence-${{ inputs.platform }}-${{ steps.target.outputs.key }}
        path: |
          ${{ env.TAPP_CAPTURES_DIR }}/
          ${{ runner.temp }}/tapp-report.json
          ${{ runner.temp }}/tapp-report.md
          ${{ runner.temp }}/tapp-pr-changed-files.json
          ${{ runner.temp }}/tapp-pr-plan.json
        if-no-files-found: ignore
        retention-days: 14

    - name: Enforce gate
      if: always()
      shell: bash
      env:
        TAPP_GATE_FAILED: ${{ steps.gate.outputs.gate_failed }}
        TAPP_OUTCOME: ${{ steps.gate.outputs.outcome }}
      # Runs last so the PR comment + evidence upload happen first, then blocks the merge.
      # gate_failed is exit-code derived (fail=1, inconclusive=3 both block); outcome is the label.
      run: |
        if [[ "$TAPP_GATE_FAILED" == "true" ]]; then
          echo "::error::Tapp gate did not pass (outcome: $TAPP_OUTCOME). See the PR comment / step summary."
          exit 1
        fi
        echo "Tapp gate passed (outcome: $TAPP_OUTCOME)."
