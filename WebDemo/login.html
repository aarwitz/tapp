<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>WebDemo — Sign in</title></head>
<body>
<h1>Sign in</h1>
<a href="/">Home</a>
<form onsubmit="event.preventDefault(); document.getElementById('msg').textContent='Signed in (demo)';">
  <label>Email <input type="email" name="email" placeholder="you@example.com"></label>
  <label>Password <input type="password" name="password" placeholder="password"></label>
  <button type="submit">Sign in</button>
</form>
<p id="msg"></p>
</body>
</html>
