name: Bug report
description: Report a reproducible Tapp CLI, Skill, MCP, Action, or VS Code problem.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Tapp. Do not paste credentials, private source, customer data, or unredacted capture contents. If the report requires private evidence, describe the failure first and wait for a safe transfer path.
  - type: input
    id: version
    attributes:
      label: Tapp version
      description: Run `npx -y @aarwitz/tapp@latest version`.
      placeholder: 0.17.2
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - npm CLI
        - Agent Skill
        - MCP server
        - GitHub Action
        - VS Code extension
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Target platform
      options:
        - iOS simulator
        - Android emulator or device
        - Web
        - Setup or packaging (not target-specific)
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the command or agent request, what happened, and what you expected. Redact private paths and values.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Relevant doctor output
      description: Paste only the relevant, non-sensitive lines from `npx -y @aarwitz/tapp@latest doctor`.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, private source, customer data, and sensitive capture contents.
          required: true
