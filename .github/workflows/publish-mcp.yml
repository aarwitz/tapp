name: Publish MCP Registry descriptor

on:
  release:
    types: [published]
  workflow_run:
    workflows: ["Publish npm package"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: mcp-registry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'aarwitz/tapp' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # `release: published` fires from gh CLI's default GITHUB_TOKEN inside publish-npm.yml,
      # and GitHub's anti-recursion guard means events from that token never trigger other
      # workflows — so this job silently never ran for v0.17.21-23. workflow_run chains off
      # the WORKFLOW's completion instead of the release event, which isn't subject to that
      # guard, and still checks out the exact commit that tag pointed to.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Verify the published npm package and release identity
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(jq -r '.version' server.json)"
          PACKAGE_VERSION="$(jq -r '.packages[0].version' server.json)"
          test "$VERSION" = "$PACKAGE_VERSION"
          test "$(npm view "@aarwitz/tapp@$VERSION" version)" = "$VERSION"
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            test "$GITHUB_REF_NAME" = "v$VERSION"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            test "${{ github.event.workflow_run.head_branch }}" = "v$VERSION"
          fi

      - name: Install the checksum-pinned MCP publisher
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum --check
          tar -xzf mcp-publisher.tar.gz mcp-publisher

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json when the version is new
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_VERSION="$(jq -r '.version' server.json)"
          if curl --fail --silent --show-error --get \
            --data-urlencode 'search=io.github.aarwitz/tapp' \
            https://registry.modelcontextprotocol.io/v0.1/servers \
            | jq -e --arg current "$CURRENT_VERSION" '
              any(.servers[]; .server.name == "io.github.aarwitz/tapp" and .server.version == $current)
            ' >/dev/null; then
            echo "MCP descriptor $CURRENT_VERSION already exists; preserving the immutable version."
          else
            ./mcp-publisher publish server.json
          fi

      - name: Deprecate superseded Tapp descriptors
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_VERSION="$(jq -r '.version' server.json)"
          REGISTRY_RESPONSE="$(curl --fail --silent --show-error --get \
            --data-urlencode 'search=io.github.aarwitz/tapp' \
            https://registry.modelcontextprotocol.io/v0.1/servers)"
          while IFS= read -r VERSION; do
            [[ -n "$VERSION" ]] || continue
            ./mcp-publisher status \
              --status deprecated \
              --message "Superseded by Tapp $CURRENT_VERSION; install @aarwitz/tapp@latest." \
              io.github.aarwitz/tapp "$VERSION"
          done < <(jq -r --arg current "$CURRENT_VERSION" '
            .servers[]
            | select(.server.name == "io.github.aarwitz/tapp")
            | select(.server.version != $current)
            | select(._meta["io.modelcontextprotocol.registry/official"].status == "active")
            | .server.version
          ' <<<"$REGISTRY_RESPONSE")
