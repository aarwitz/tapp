# tapp's own gate: a tool that decides whether other software ships must visibly test itself.
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Unit, protocol & CLI tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      # Verdict/report/regression unit tests, engine import-safety, target resolution,
      # CLI smoke, and a real MCP initialize + tools/list handshake over stdio.
      - run: npm test
      - name: Shell syntax
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - name: JS syntax
        run: |
          node --check bin/tapp.js
          for f in mcp-server/src/*.js; do node --check "$f"; done

  harness-build:
    name: iOS harness compiles
    # A broken harness must never hide behind a green badge — this job gates merges.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build the XCUITest harness for the simulator
        run: |
          xcodebuild build-for-testing \
            -project Harness/OCQAHarness.xcodeproj \
            -scheme OCQAHarnessUITests \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/harness-ci \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tail -20
