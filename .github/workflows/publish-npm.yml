name: Publish npm package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # the release step below turns the tag into a real GitHub release
  id-token: write

jobs:
  publish:
    if: github.repository == 'aarwitz/tapp'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Match package version to tag
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$version" != "$tag_version" ]]; then
            echo "package.json version $version does not match tag $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11

      - run: npm ci
      - name: Run package unit tests
        run: npm test
        env:
          TAPP_SKIP_REAL_BROWSER_TESTS: '1'
      - run: npm publish --provenance --access public

      # Several releases reached npm with no GitHub release behind the tag, so every workflow
      # `tapp ci install` generated referenced an action version that did not resolve (public
      # issue #12). The tag that triggered this run becomes a real release here, from the
      # changelog section for that version.
      - name: Create the GitHub release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          notes="$(awk -v want="## $version" '$0 == want {f=1; next} f && /^## /{exit} f' CHANGELOG.md)"
          if [[ -z "${notes//[[:space:]]/}" ]]; then
            notes="See CHANGELOG.md for $version."
          fi
          printf '%s\n' "$notes" > "$RUNNER_TEMP/notes.md"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; leaving it alone"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "Tapp $version" --notes-file "$RUNNER_TEMP/notes.md"
          fi
