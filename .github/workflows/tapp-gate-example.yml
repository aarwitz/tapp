# Example: Tapp release gate in CI, self-tested against DemoApp.
#
# MANUAL TRIGGER ONLY (workflow_dispatch) — macOS runners bill at 10× on private repos, so this
# does not run on every push. To gate real PRs, copy this into the app repo and swap the trigger:
#
#   on:
#     pull_request:
#       branches: [main]
#
# A successful, conclusive run on main automatically seeds/refreshes the baseline in the
# Actions cache and a 90-day artifact fallback.
# PRs then fail only on NEW high/critical findings or broken Flows — existing debt doesn't
# block, regressions do. A committed `.autotap/baseline.json` takes precedence when desired.
name: Tapp Gate (example)

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: tapp-example-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tapp:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate DemoApp project
        run: ruby generate-demoapp-xcodeproj.rb

      - name: Tapp release gate
        uses: ./ # in an app repo: aarwitz/tapp@main
        with:
          target-key: target_demoapp_ios
          project: DemoApp/DemoApp.xcodeproj
          scheme: DemoApp
          max-actions: 40
          # Explicit, because this repo's default flow dir also holds demoapp-negative.yml —
          # a fixture that fails BY DESIGN (it asserts a screen that doesn't exist).
          flows: ".autotap/flows/demoapp-smoke.yml DemoApp/.autotap/flows/menu-to-daily-summary.yml"
